name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra redis --extra dev

      - name: Lint
        run: uv run --extra dev ruff check .

      - name: Test
        run: uv run --extra dev --extra redis pytest -q

      - name: Watchlist e2e
        run: scripts/e2e_watchlist.sh

