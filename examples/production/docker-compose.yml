services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: roost
      POSTGRES_USER: roost
      POSTGRES_PASSWORD: roost
    ports:
      - "5432:5432"
    volumes:
      - roost-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roost -d roost"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  roost-postgres:
